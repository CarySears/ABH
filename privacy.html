<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Privacy Policy - Anna Brooke Healing</title>
	<style>
		@font-face { font-family: 'Ostia Antica'; src: url('./Ostia_Antica_WEB-Regular.woff2') format('woff2'); font-display: swap; }
		@font-face { font-family: 'ITC Clearface'; src: url('./ITCClearFaceReg.woff2') format('woff2'); font-display: swap; }
		@font-face { font-family: 'Brandon Grotesque'; src: url('./BrandonGrotesque-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }

		:root { --primary-color:#164a50; --accent-color:#164a50; --text-color:#164a50; --background-color:#f2ede2; }
		*{ box-sizing: border-box; }
		body{ margin:0; background:var(--background-color); color:var(--text-color); font-family:'Brandon Grotesque', -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; line-height:1.7; }
		.container{ max-width:960px; margin:0 auto; padding:24px; }
		header.site-header{ position:sticky; top:0; background:rgba(242,237,226,.95); backdrop-filter:blur(8px); border-bottom:1px solid rgba(22,74,80,.15); z-index:10; }
		.site-header__inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
		.brand{ display:flex; align-items:center; gap:12px; font-family:'Ostia Antica', Georgia, serif; font-size:1.25rem; }
		.crumbs{ font-size:.95rem; }
		.crumbs a{ text-decoration:none; }
		.crumbs span{ opacity:.7; }
		h1{ font-family:'Ostia Antica', Georgia, serif; font-weight:normal; margin:0 0 12px; font-size:clamp(1.8rem,3vw,2.6rem); color:var(--primary-color); }
		.subtitle{ font-family:'ITC Clearface', Georgia, serif; font-size:1.1rem; opacity:.9; margin-bottom:24px; }
		.policy-card{ background:rgba(242,237,226,.9); border:1px solid rgba(22,74,80,.15); border-radius:12px; padding:20px; box-shadow:0 8px 28px rgba(0,0,0,.08); }
		.policy-actions{ display:flex; gap:12px; margin-top:20px; }
		.btn{ display:inline-flex; align-items:center; justify-content:center; padding:12px 16px; border-radius:8px; border:1px solid rgba(22,74,80,.15); text-decoration:none; color:var(--text-color); background:white; transition:transform .1s ease, box-shadow .2s ease; }
		.btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
		.btn.primary{ background:var(--primary-color); color:#fff; border-color:var(--primary-color); }
		footer.page-footer{ padding:24px; border-top:1px solid rgba(22,74,80,.15); background:rgba(242,237,226,.9); }
		.page-footer .links{ display:flex; gap:16px; flex-wrap:wrap; font-size:.95rem; }
	</style>
</head>
<body>
	<a href="#content" class="skip-link" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to content</a>
	<header class="site-header">
		<div class="site-header__inner container">
			<div class="brand">Anna Brooke Healing</div>
			<nav class="crumbs" aria-label="Breadcrumb">
				<a href="./index.html">Home</a>
				<span aria-hidden="true">/</span>
				<span>Privacy Policy</span>
			</nav>
		</div>
	</header>
	<main id="content" class="container" role="main">
		<h1>Privacy Policy</h1>
		<p class="subtitle">How we collect, use, and protect your information.</p>
		<div class="policy-card">
			<a class="wpembed-inline" href="https://app.websitepolicies.com/policies/view/ot8ehwen">Privacy policy</a><script src="https://cdnapp.websitepolicies.com/widgets/policies/embed.min.js" defer></script>
		</div>
		<div class="policy-actions">
			<a class="btn" href="./terms.html" target="_blank" rel="noopener">View Terms & Conditions</a>
			<a class="btn" href="./cookies.html" target="_blank" rel="noopener">View Cookie Policy</a>
			<a class="btn primary" href="./index.html#contact" target="_blank" rel="noopener">Contact</a>
		</div>
	</main>
	<footer class="page-footer">
		<div class="container">
			<div class="links">
				<a href="./index.html" target="_blank" rel="noopener">Home</a>
				<a href="./privacy.html" target="_blank" rel="noopener">Privacy</a>
				<a href="./cookies.html" target="_blank" rel="noopener">Cookies</a>
				<a href="./terms.html" target="_blank" rel="noopener">Terms</a>
			</div>
		</div>
	</footer>
</body>
</html>
