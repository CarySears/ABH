<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Anna Brooke Healing</title>
    
    <!-- Anna's Authentic Brand Fonts with Optimized Loading -->
    <style>
        @font-face {
            font-family: 'Ostia Antica';
            src: url('./Ostia_Antica_WEB-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'ITC Clearface';
            src: url('./ITCClearFaceReg.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('./BrandonGrotesque-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-color: #164a50;
            --accent-color: #164a50;
            --text-color: #164a50;
            --background-color: #f2ede2;
            --shell-color: #f3d9d0;
            --sand-color: #f2ede2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Brandon Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            font-weight: 500;
        }

        .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

        header { padding: 24px 0; }
        header a { color: var(--primary-color); text-decoration: none; font-size: 1rem; }

        .thankyou {
            text-align: center;
            padding: 96px 0 64px;
        }
        .thankyou h1 {
            font-family: 'Ostia Antica', 'Playfair Display', serif;
            font-weight: normal;
            font-size: clamp(2rem, 4vw, 3rem);
            color: var(--primary-color);
            margin-bottom: 16px;
        }
        .thankyou p { font-size: 1.125rem; margin-bottom: 24px; }

        .cta-button {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            margin-top: 64px;
            padding: 24px 0;
            border-top: 1px solid rgba(22,74,80,0.15);
            text-align: center;
            font-size: 0.95rem;
        }
        footer a { color: var(--primary-color); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/">← Back to Home</a>
        </div>
    </header>

    <main class="thankyou">
        <div class="container">
            <h1>Thank you for reaching out</h1>
            <p>Your message has been received. I’ll get back to you shortly.</p>
            <p>If you need immediate support, feel free to email <a href="mailto:anna@annabrookehealing.com">anna@annabrookehealing.com</a> or call <a href="tel:+16469434635">(646) 943-4635</a>.</p>
            <div style="margin-top:24px;">
                <a class="cta-button" href="/index.html#services">Explore Services</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> Anna Brooke Healing</p>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
